<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>获取用户授权码</title>
	</head>
    <body></body>
	<script>
		
		// 获取参数
		function getQueryVariable(variable){
			var query = window.location.search.substring(1);
			var vars = query.split("&");
			for (var i = 0; i< vars.length; i++) {
				var pair = vars[i].split("=");
				if (pair[0] == variable) return pair[1];
			}
			return '';
		}

		function browser(){
			var u = navigator.userAgent, app = navigator.appVersion;
			var android = u.indexOf('Android') > -1 || u.indexOf('Linux') > -1; 
			var ios = !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/); //ios终端
			return {android, ios}
		}
		
		// 拼接重定向链接
		function getRedirectUrl() {
			var searchString = window.location.search.substring(1);
			var urlArr = window.location.href.split('/getAuthCode.html') || [];
			var urlPrefix = urlArr[0];
			var browserIs = browser();
			var authCode = getQueryVariable('code'); // 微信授权code
			var redirectPage = decodeURIComponent(getQueryVariable('redirectPage')); // 重定向页面path
			var hasLastPageArg = getQueryVariable('lastPageArg'); // 前页面参数
			var lastPageArg = hasLastPageArg ? '&lastPageArg=' + hasLastPageArg : ''; 
			return urlPrefix + '/#/pages-a/authorization/code-auth?authCode=' + authCode + '&redirectPage=' + redirectPage + lastPageArg;
		}
			
		// 程序入口
		function main() {
			// 重定向值商城
			var redirectUrl = getRedirectUrl()
			if (redirectUrl) window.location.replace(redirectUrl);
		}
		
		main();







		
	</script>
</html>
