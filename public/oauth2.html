    function getQueryStrs(name) {
      var reg = new RegExp('(^|&)' + name + '=([^&]*)(&|$)', 'i');
      var r = window.location.search.substr(1).match(reg);
      if (r != null) {
        if(name == "leaseUserName"){
          return r[2]
        }else{
          return unescape(r[2]);
        }
      }
      return null;
    }
  </script>
