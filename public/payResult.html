<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<title>支付结果</title>
	<style type="text/css">
		*{
			margin: 0;
			padding: 0;
		} 
		#container{
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			width: 100%;
			height: 310px;
			background-color: #C8924B;
		}
		.query{
			font-size: 22px;
			color: #fff;
			display: block;
		}
		.result-ui{
			display: none;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}
		.result-txt-icon{
			display: flex;
			justify-content: center;
			align-items: center;
		}
		.result-txt-icon > div{
			display: none;
			justify-content: center;
			align-items: center;
		}
		.result-txt-icon svg{
			transform: scale(.9);
		}
		.result-txt-icon span{
			margin-left: 5px;
			font-size: 20px;
			color: #fff;
		}
		.buttons{
			margin-top: 18px;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		.buttons button{
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100px;
			height: 30px;
			border: 1px solid #fff;
			border-radius: 15px;
			font-size: 13px;
			background-color: transparent;
			color: #fff;
			outline: none;
		}
		.to-index{
			margin-right: 20px;
		}
	</style>
	<script crossorigin="anonymous" integrity="sha512-n/4gHW3atM3QqRcbCn6ewmpxcLAHGaDjpEBu4xZd47N0W2oQ+6q7oc3PXstrJYXcbNU1OHdQ1T7pAP+gi5Yu8g==" src="https://lib.baomitu.com/jquery/3.6.0/jquery.js"></script>
	<script type="text/javascript" charset="UTF-8" src="https://wx.gtimg.com/pay_h5/goldplan/js/jgoldplan-1.0.0.js"></script>
</head>

<body>
	<div id="container">
		<div class="query">正在查询支付结果...</div>
		<div class="result-ui">
			<!-- 结果图标 -->
			<div class="result-txt-icon">
				<div class="pay-success">
					<svg t="1628473462303" class="icon" viewBox="0 0 1024 1024" fill="#fff" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="1967" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32"><defs><style type="text/css"></style></defs><path d="M512 64a448 448 0 1 1 0 896A448 448 0 0 1 512 64z m0 64a384 384 0 1 0 0 768A384 384 0 0 0 512 128zM282.624 611.2H351.36c35.52 60.416 82.112 96.128 160.64 96.128 73.92 0 117.888-27.072 155.008-84.928l6.848-11.2h67.52a246.208 246.208 0 0 1-453.76 11.84l-4.992-11.84H351.36z m387.2-251.264a48 48 0 1 1 0 96 48 48 0 0 1 0-96z m-315.2 0a48 48 0 1 1 0 96 48 48 0 0 1 0-96z" p-id="1968"></path></svg>
					<span>支付成功</span>
				</div>
				<div class="pay-fail">
					<svg t="1628474607652" class="icon" viewBox="0 0 1024 1024" fill="#fff" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="2113" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32"><defs><style type="text/css"></style></defs><path d="M512 64a448 448 0 1 1 0 896A448 448 0 0 1 512 64z m0 64a384 384 0 1 0 0 768A384 384 0 0 0 512 128z m0 483.2A246.208 246.208 0 0 1 741.376 768h-67.52C635.328 702.4 590.528 671.872 512 671.872c-78.528 0-125.12 35.712-160.64 96.128H282.624A246.208 246.208 0 0 1 512 611.2z m157.888-251.264a48 48 0 1 1 0 96 48 48 0 0 1 0-96z m-315.264 0a48 48 0 1 1 0 96 48 48 0 0 1 0-96z" p-id="2114"></path></svg>
					<span>支付失败</span>
				</div>	
			</div>
			<!-- 按钮 -->
			<div class="buttons">
				<button class="to-index">返回首页</button>
				<button class="view-order">查看订单</button>
			</div>
		</div>
	</div>
</body>
<script>
	// baseUrl、prefixPath 打包时会取appConfig->config.json
	var baseUrl = 'http://csms.cfldcn.com'; 
	var prefixPath = '/api-gateway'; 
	var timer = null;
	var pollEnd = null;
	var payStatus = 0;
	var isCancelPay = false;

	// 获取参数
	function getQueryVariable(variable){
		var query = window.location.search.substring(1);
		var vars = query.split("&");
		for (var i = 0; i< vars.length; i++) {
			var pair = vars[i].split("=");
			if (pair[0] == variable) return pair[1];
		}
		return '';
	}
	// onIframeReady
	function onIframeReady() {
		var mchData = {
			action: 'onIframeReady',
			displayStyle: 'SHOW_CUSTOM_PAGE'
		};
		var postData = JSON.stringify(mchData);
		var customPageHeight = document.body.scrollHeight;
		var height = customPageHeight * (640 / Math.round(document.documentElement.getBoundingClientRect().width));
		parent.postMessage(postData, 'https://payapp.weixin.qq.com');
	}
	// 获取支付结果
	function getPayResult() {
		var testApi = function() {
			var testPms = new Promise((resolve) => {
				setTimeout(function () {
					var rd = Math.random();
					resolve({statusCode: rd > .5 ? 200 : 204})
				}, 100);
			});
			testPms.then(res => {
				if (res.statusCode === 200) {
					pollEnd = true;
					payStatus = 1;
					
				} 
			})
		}
		var prodApi = function() {
			var paySn = getQueryVariable('paySn') || '';
			var url = baseUrl + prefixPath + '/mall-order-service/app/order/order-result' + '/' + paySn;
			var appletId = getQueryVariable('xAppletId') || localStorage.APP_X_APPLET_ID;
			$.ajax({
				type: "GET",
				url: url,
				headers:{'x-applet-id': appletId},
				success: function(res){
					if (res.status == 10200) {
						pollEnd = true;
						payStatus = 1;
					}
				},
				error: function(error){
					
				}
			});
		}
		prodApi();
	}
	// 返回应用页
	function clickAppPage(pageKey) {
		var hasIfram = parent.frames.length;
		var prefix = window.location.href.split('payResult.html?')[0];
		var payStatusCode = decodeURIComponent(payStatus)
		var page = pageKey === 'index' ? '/pages-mall/index/index' : `/pages-mall-a/order/list?orderStatus=${payStatusCode}`;
		var url = prefix + '#' + page;
		var postData = {
			action:'jumpOut',
			jumpOutUrl: url
		}
		hasIfram ? parent.postMessage(JSON.stringify(postData),'https://payapp.weixin.qq.com') :  window.location.replace(url);
	}
	// 按钮事件
	function buttonEvent() {
		$('.to-index').click(function(){
			clickAppPage('index')
		});
		$('.view-order').click(function(){
			clickAppPage('orderStatus')
		});
	}
	// 展示支付结果UI
	function showPayResultUi() {
		$('.result-ui').css('display', 'flex');
		$('.query').css('display', 'none');
		if(payStatus) $('.pay-success').css('display', 'flex');
		if(!payStatus) $('.pay-fail').css('display', 'flex');
	}
	// 轮询支付结果
	function pollResult(option) {
		var count = 0;
		timer = setInterval(_ => {
			var pollEndFlag = pollEnd;
			if (pollEndFlag || count >= 5) {
				clearInterval(timer);
				showPayResultUi();
			} else {
				count = count + 1;
				getPayResult(option);
			}
		}, 2000)
	}
	// 程序入口
	function main() {
		$(function() {
			var status = getQueryVariable('status') || '';
			isCancelPay = status === 'WAIT_BUYER_PAY';
			onIframeReady();
			buttonEvent();
			if (isCancelPay) {
				payStatus = 0;
				showPayResultUi();
			} else {
				getPayResult();
				pollResult();
			}
		});
	}
	
	main();
</script>

</html>
